                    </div>
                </div>
            `);
        };

        window.editCustomer = function (id) {
            const c = getCustomer(id);
            if (c) openCustomerModal(c);
        };

        window.deleteCustomer = function (id) {
            if (!confirm('⚠️ Delete this customer and all their records?\nThis action cannot be undone!')) return;

            const balance = getCustomerBalance(id);
            if (balance > EPS) {
                if (!confirm(`Customer has ₹${balance.toFixed(2)} pending balance. Delete anyway?`)) return;
            }

            setCustomers(getCustomers().filter(c => c.id !== id));
            setRecords(getRecords().filter(r => r.customer_id !== id));
            setPayments(getPayments().filter(p => p.customer_id !== id));
            showToast('Customer deleted', 'info');
            renderCustomersList();
            renderDashboard();
            populateDropdowns();
        };

        function openCustomerModal(data = null) {
            const isEdit = !!data;
            const safeData = data ? {
                ...data,
                name: sanitizeString(data.name),
                mobile: sanitizeString(data.mobile),
                address: sanitizeString(data.address || ''),
                notes: sanitizeString(data.notes || ''),
                status: sanitizeString(data.status || 'active'),
            } : null;

            const formId = 'customerForm_' + Date.now();

            openModal(`
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-lg font-bold">${isEdit ? 'Edit' : 'Add'} Customer</h3>
                    <button onclick="window.closeModal()" class="btn btn-ghost btn-sm">✕</button>
                </div>
                <form id="${formId}" class="space-y-2" autocomplete="off">
                    <input type="hidden" id="editCustomerId" value="${safeData?.id || ''}" />
                    <div><label class="text-xs font-medium text-muted">Full Name *</label><input type="text" id="custName" value="${safeData?.name || ''}" class="input" required maxlength="100" /></div>
                    <div><label class="text-xs font-medium text-muted">Mobile *</label><input type="tel" id="custMobile" value="${safeData?.mobile || ''}" class="input" required pattern="[0-9]{10}" maxlength="10" /></div>
                    <div><label class="text-xs font-medium text-muted">Address</label><input type="text" id="custAddress" value="${safeData?.address || ''}" class="input" maxlength="200" /></div>
                    <div><label class="text-xs font-medium text-muted">Joining Date</label><input type="date" id="custJoining" value="${safeData?.joining_date || new Date().toISOString().slice(0, 10)}" class="input" /></div>
                    <div><label class="text-xs font-medium text-muted">Status</label>
                        <select id="custStatus" class="input">
                            <option value="active" ${safeData?.status === 'active' ? 'selected' : ''}>Active</option>
                            <option value="inactive" ${safeData?.status === 'inactive' ? 'selected' : ''}>Inactive</option>
                        </select>
                    </div>
                    <div><label class="text-xs font-medium text-muted">Default Rate (₹)</label>
                        <input type="number" id="custDefaultRate" value="${safeData?.defaultRate || STATE.DEFAULT_RATE}" step="0.50" min="0" max="1000" class="input" />
                    </div>
                    <div class="grid-2">
                        <div><label class="text-xs font-medium text-muted">Expected Morning (L)</label>
                            <input type="number" id="custExpectedMorning" value="${safeData?.expectedMorning || 0}" step="0.01" min="0" max="100" class="input" />
                        </div>
                        <div><label class="text-xs font-medium text-muted">Expected Evening (L)</label>
                            <input type="number" id="custExpectedEvening" value="${safeData?.expectedEvening || 0}" step="0.01" min="0" max="100" class="input" />
                        </div>
                    </div>
                    <div><label class="text-xs font-medium text-muted">Notes</label><textarea id="custNotes" class="input" rows="2" maxlength="500">${safeData?.notes || ''}</textarea></div>
                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="btn btn-primary flex-1">Save</button>
                        <button type="button" onclick="window.closeModal()" class="btn btn-outline flex-1">Cancel</button>
                    </div>
                </form>
            `);

            const form = document.getElementById(formId);
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                const id = parseInt(document.getElementById('editCustomerId').value);
                const name = sanitizeString(document.getElementById('custName').value);
                const mobile = sanitizeString(document.getElementById('custMobile').value);
                const address = sanitizeString(document.getElementById('custAddress').value);
                const joining_date = document.getElementById('custJoining').value;
                const status = sanitizeString(document.getElementById('custStatus').value);
                const defaultRate = sanitizeNumber(document.getElementById('custDefaultRate').value);
                const expectedMorning = sanitizeNumber(document.getElementById('custExpectedMorning').value);
                const expectedEvening = sanitizeNumber(document.getElementById('custExpectedEvening').value);
                const notes = sanitizeString(document.getElementById('custNotes').value);

                if (!name || name.length < 2) {
                    showToast('Name must be at least 2 characters', 'error');
                    return;
                }
                if (!validateMobile(mobile)) {
                    showToast('Invalid mobile number (10 digits required)', 'error');
                    return;
                }
                const existing = getCachedCustomers().find(c => c.mobile === mobile && c.id !== id);
                if (existing) {
                    showToast('⚠️ Mobile number already exists for ' + sanitizeString(existing.name), 'error');
                    return;
                }
                if (defaultRate <= 0) {
                    showToast('Default rate must be greater than 0', 'error');
                    return;
                }

                const customerData = {
                    name,
                    mobile,
                    address,
                    joining_date,
                    status,
                    defaultRate,
                    expectedMorning,
                    expectedEvening,
                    notes,
                };

                let customers = getCustomers();
                if (id) {
                    const idx = customers.findIndex(c => c.id === id);
                    if (idx > -1) customers[idx] = { ...customers[idx], ...customerData };
                    showToast('Customer updated!', 'success');
                } else {
                    customerData.id = getNextCustomerId();
                    customerData.customer_id = `CUST-${String(customers.length + 1).padStart(3, '0')}`;
                    customers.push(customerData);
                    showToast('Customer added!', 'success');
                }
                setCustomers(customers);
                closeModal();
                renderCustomersList();
                renderDashboard();
                populateDropdowns();
            });
        }

        // ═══════════════════════════════════════════════════════════════
        //  RECORDS
        // ═══════════════════════════════════════════════════════════════
        function renderRecords() {
            const container = document.getElementById('tab-records');
            container.innerHTML = `
                <div class="space-y-3 w-full">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <h2 class="text-lg font-bold">🥛 Milk Collection</h2>
                        <div class="flex gap-2 flex-wrap">
                            <select id="filterCustomer" class="input" style="min-width:100px;min-height:38px;font-size:0.8rem;"></select>
                            <select id="filterPeriod" class="input" style="min-width:90px;min-height:38px;font-size:0.8rem;">
                                <option value="today">Today</option>
                                <option value="week">This Week</option>
                                <option value="month" selected>This Month</option>
                                <option value="lastmonth">Last Month</option>
                                <option value="custom">Custom</option>
                            </select>
                            <input type="date" id="filterDateFrom" class="input hidden" style="min-height:38px;max-width:120px;font-size:0.8rem;" />
                            <input type="date" id="filterDateTo" class="input hidden" style="min-height:38px;max-width:120px;font-size:0.8rem;" />
                            <button id="applyFilterBtn" class="btn btn-primary btn-sm">Apply</button>
                            <button id="addRecordBtn" class="btn btn-success btn-sm">➕ Add</button>
                        </div>
                    </div>
                    
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th><th>Customer</th><th>Morning</th><th>Evening</th>
                                    <th>Total</th><th>Rate</th><th>Amount</th><th class="text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="recordsTableBody"></tbody>
                        </table>
                    </div>
                    
                    <div class="card-grid" id="recordsCardGrid"></div>
                    
                    <div id="recordsPagination" class="flex justify-between items-center text-xs text-muted"></div>
                </div>
            `;

            populateRecordDropdowns();
            document.getElementById('applyFilterBtn').addEventListener('click', () => {
                STATE.recordsPage = 1;
                renderRecordsList();
            });
            document.getElementById('addRecordBtn').addEventListener('click', () => openRecordModal());
            document.getElementById('filterPeriod').addEventListener('change', (e) => {
                const custom = e.target.value === 'custom';
                document.getElementById('filterDateFrom').classList.toggle('hidden', !custom);
                document.getElementById('filterDateTo').classList.toggle('hidden', !custom);
            });
            renderRecordsList();
        }

        function populateRecordDropdowns() {
            const customers = getCachedCustomers();
            const sel = document.getElementById('filterCustomer');
            if (sel) {
                sel.innerHTML = '<option value="">All</option>' + customers.map(c =>
                    `<option value="${c.id}">${sanitizeString(c.name)}</option>`
                ).join('');
            }
            const recSel = document.getElementById('recCustomer');
            if (recSel) {
                const currentVal = recSel.value;
                recSel.innerHTML = '<option value="">Select</option>' + customers.map(c =>
                    `<option value="${c.id}" data-rate="${c.defaultRate || STATE.DEFAULT_RATE}" data-morning="${c.expectedMorning || 0}" data-evening="${c.expectedEvening || 0}">${sanitizeString(c.name)}</option>`
                ).join('');
                if (currentVal) recSel.value = currentVal;
            }
        }

        function renderRecordsList() {
            const filterCust = document.getElementById('filterCustomer').value;
            const period = document.getElementById('filterPeriod').value;
            let list = getCachedRecords();
            if (filterCust) list = list.filter(r => r.customer_id === parseInt(filterCust));

            const today = new Date().toISOString().slice(0, 10);
            if (period === 'today') list = list.filter(r => r.date === today);
            else if (period === 'week') {
                const weekAgo = new Date();
                weekAgo.setDate(weekAgo.getDate() - 7);
                const from = weekAgo.toISOString().slice(0, 10);
                list = list.filter(r => r.date >= from && r.date <= today);
            } else if (period === 'month') {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const prefix = year + '-' + month;
                list = list.filter(r => r.date && r.date.startsWith(prefix));
            } else if (period === 'lastmonth') {
                const now = new Date();
                const year = now.getFullYear();
                const month = now.getMonth();
                let lastMonthYear = year;
                let lastMonth = month - 1;
                if (lastMonth < 0) {
                    lastMonth = 11;
                    lastMonthYear = year - 1;
                }
                const prefix = lastMonthYear + '-' + String(lastMonth + 1).padStart(2, '0');
                list = list.filter(r => r.date && r.date.startsWith(prefix));
            } else if (period === 'custom') {
                const from = document.getElementById('filterDateFrom').value;
                const to = document.getElementById('filterDateTo').value;
                if (from) list = list.filter(r => r.date >= from);
                if (to) list = list.filter(r => r.date <= to);
            }

            list.sort((a, b) => a.date < b.date ? 1 : -1);
            const page = STATE.recordsPage;
            const size = STATE.pageSize;
            const total = list.length;
            const pages = Math.ceil(total / size) || 1;
            const start = (page - 1) * size;
            const end = Math.min(start + size, total);
            const items = list.slice(start, end);

            const tbody = document.getElementById('recordsTableBody');
            if (!items.length) {
                tbody.innerHTML =
                    '<tr><td colspan="8" class="text-center text-muted py-4">No records found.</td></tr>';
            } else {
                tbody.innerHTML = items.map(r =>
                    `<tr>
                        <td>${r.date}</td>
                        <td>${getCustomerName(r.customer_id)}</td>
                        <td>${sanitizeNumber(r.morning_milk).toFixed(2)}</td>
                        <td>${sanitizeNumber(r.evening_milk).toFixed(2)}</td>
                        <td class="font-bold">${sanitizeNumber(r.total_liters).toFixed(2)}</td>
                        <td>₹${sanitizeNumber(r.rate).toFixed(2)}</td>
                        <td>₹${sanitizeNumber(r.amount).toFixed(2)}</td>
                        <td class="text-right space-x-1">
                            <button onclick="editRecord(${r.id})" class="btn btn-ghost btn-sm btn-tooltip">
                                ✏️ <span class="tooltip-text">Edit</span>
                            </button>
                            <button onclick="deleteRecord(${r.id})" class="btn btn-ghost btn-sm text-danger btn-tooltip">
                                🗑️ <span class="tooltip-text">Delete</span>
                            </button>
                        </td>
                    </tr>`
                ).join('');
            }

            const cardGrid = document.getElementById('recordsCardGrid');
            if (!items.length) {
                cardGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🥛</div>
                        <div class="empty-title">No records found</div>
                        <div class="empty-desc">Add your first milk collection record</div>
                    </div>
                `;
            } else {
                cardGrid.innerHTML = items.map(r => `
                    <div class="record-card">
                        <div class="record-header">
                            <div>
                                <div class="record-date">📅 ${r.date}</div>
                                <div class="record-customer">👤 ${getCustomerName(r.customer_id)}</div>
                            </div>
                            <span class="badge badge-active">₹${sanitizeNumber(r.rate).toFixed(2)}/L</span>
                        </div>
                        <div class="record-details">
                            <div class="detail-item">
                                <span class="detail-value">${sanitizeNumber(r.morning_milk).toFixed(2)}L</span>
                                <span class="detail-label">Morning</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-value">${sanitizeNumber(r.evening_milk).toFixed(2)}L</span>
                                <span class="detail-label">Evening</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-value text-primary">${sanitizeNumber(r.total_liters).toFixed(2)}L</span>
                                <span class="detail-label">Total</span>
                            </div>
                        </div>
                        
                        <div class="record-amount-row">
                            <span class="amount-left">Total Amount</span>
                            <span class="amount-right">₹${sanitizeNumber(r.amount).toFixed(2)}</span>
                        </div>
                        
                        <div class="record-actions">
                            <button onclick="editRecord(${r.id})" class="btn btn-ghost btn-sm btn-tooltip">✏️ <span class="tooltip-text">Edit</span></button>
                            <button onclick="deleteRecord(${r.id})" class="btn btn-ghost btn-sm text-danger btn-tooltip">🗑️ <span class="tooltip-text">Delete</span></button>
                        </div>
                    </div>
                `).join('');
            }

            const pag = document.getElementById('recordsPagination');
            pag.innerHTML = `
                <span>${start + 1}-${end} of ${total}</span>
                <div class="flex gap-1">
                    <button onclick="changeRecordsPage(-1)" class="btn btn-ghost btn-sm" ${page <= 1 ? 'disabled' : ''}>‹</button>
                    <span class="px-2">${page}/${pages}</span>
                    <button onclick="changeRecordsPage(1)" class="btn btn-ghost btn-sm" ${page >= pages ? 'disabled' : ''}>›</button>
                </div>
            `;
        }

        window.changeRecordsPage = (delta) => {
            const list = getCachedRecords();
            const pages = Math.ceil(list.length / STATE.pageSize) || 1;
            STATE.recordsPage = Math.max(1, Math.min(pages, STATE.recordsPage + delta));
            renderRecordsList();
        };

        window.editRecord = function (id) {
            const r = getCachedRecords().find(r => r.id === id);
            if (r) openRecordModal(r);
        };

        window.deleteRecord = function (id) {
            if (!confirm('⚠️ Delete this record?')) return;
            setRecords(getRecords().filter(r => r.id !== id));
            showToast('Record deleted', 'info');
            renderRecordsList();
            renderDashboard();
            renderCustomersList();
        };

        function openRecordModal(data = null) {
            const isEdit = !!data;
            const customers = getCachedCustomers();
            const defaultRate = data?.rate || STATE.DEFAULT_RATE;

            if (customers.length === 0) {
                showToast('❌ Please add a customer first!', 'error');
                return;
            }

            const safeData = data ? {
                ...data,
                notes: sanitizeString(data.notes || ''),
            } : null;

            const formId = 'recordForm_' + Date.now();

            openModal(`
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-lg font-bold">${isEdit ? 'Edit' : 'Add'} Milk Record</h3>
                    <button onclick="window.closeModal()" class="btn btn-ghost btn-sm">✕</button>
                </div>
                <form id="${formId}" class="space-y-2" autocomplete="off">
                    <input type="hidden" id="editRecordId" value="${safeData?.id || ''}" />
                    <div><label class="text-xs font-medium text-muted">Customer *</label>
                        <select id="recCustomer" class="input" required>
                            <option value="">Select</option>
                            ${customers.map(c => `<option value="${c.id}" data-rate="${c.defaultRate || STATE.DEFAULT_RATE}" data-morning="${c.expectedMorning || 0}" data-evening="${c.expectedEvening || 0}" ${safeData?.customer_id === c.id ? 'selected' : ''}>${sanitizeString(c.name)}</option>`).join('')}
                        </select>
                    </div>
                    <div><label class="text-xs font-medium text-muted">Date *</label><input type="date" id="recDate" value="${safeData?.date || new Date().toISOString().slice(0, 10)}" class="input" required /></div>
                    <div class="grid-2">
                        <div><label class="text-xs font-medium text-muted">Morning (L)</label>
                            <input type="number" id="recMorning" value="${safeData?.morning_milk || 0}" step="0.01" min="0" max="100" class="input" /></div>
                        <div><label class="text-xs font-medium text-muted">Evening (L)</label>
                            <input type="number" id="recEvening" value="${safeData?.evening_milk || 0}" step="0.01" min="0" max="100" class="input" /></div>
                    </div>
                    <div><label class="text-xs font-medium text-muted">Total (auto)</label>
                        <input type="number" id="recTotal" step="0.01" readonly class="input" disabled /></div>
                    <div><label class="text-xs font-medium text-muted">Rate per Liter (₹)</label>
                        <input type="number" id="recRate" value="${safeData?.rate || defaultRate}" step="0.01" min="0" max="1000" class="input" /></div>
                    <div><label class="text-xs font-medium text-muted">Amount (auto)</label>
                        <input type="number" id="recAmount" step="0.01" readonly class="input" disabled /></div>
                    <div><label class="text-xs font-medium text-muted">Notes</label>
                        <input type="text" id="recNotes" value="${safeData?.notes || ''}" class="input" maxlength="200" /></div>
                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="btn btn-primary flex-1">Save</button>
                        <button type="button" onclick="window.closeModal()" class="btn btn-outline flex-1">Cancel</button>
                    </div>
                </form>
            `);

            const recCustomer = document.getElementById('recCustomer');
            const recMorning = document.getElementById('recMorning');
            const recEvening = document.getElementById('recEvening');
            const recRate = document.getElementById('recRate');

            recCustomer.addEventListener('change', function () {
                const selected = this.options[this.selectedIndex];
                if (selected && selected.value) {
                    const rate = parseFloat(selected.dataset.rate) || STATE.DEFAULT_RATE;
                    const morning = parseFloat(selected.dataset.morning) || 0;
                    const evening = parseFloat(selected.dataset.evening) || 0;
                    recRate.value = rate;
                    if (!isEdit) {
                        recMorning.value = morning;
                        recEvening.value = evening;
                    }
                    calcTotals();
                }
            });

            const calcTotals = () => {
                const m = sanitizeNumber(recMorning.value);
                const e = sanitizeNumber(recEvening.value);
                const total = m + e;
                document.getElementById('recTotal').value = total.toFixed(2);
                const rate = sanitizeNumber(recRate.value);
                document.getElementById('recAmount').value = (total * rate).toFixed(2);
            };

            recMorning.addEventListener('input', calcTotals);
            recEvening.addEventListener('input', calcTotals);
            recRate.addEventListener('input', calcTotals);
            calcTotals();

            if (data) {
                setTimeout(() => { recCustomer.dispatchEvent(new Event('change')); }, 100);
            }

            const form = document.getElementById(formId);
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                const id = parseInt(document.getElementById('editRecordId').value);
                const customer_id = parseInt(recCustomer.value);
                const date = document.getElementById('recDate').value;
                const morning = sanitizeNumber(recMorning.value);
                const evening = sanitizeNumber(recEvening.value);
                const total = morning + evening;
                const rate = sanitizeNumber(recRate.value);
                const amount = total * rate;
                const notes = sanitizeString(document.getElementById('recNotes').value);

                if (!customer_id || !date) {
                    showToast('Customer and Date are required', 'error');
                    return;
                }
                if (total <= 0) {
                    showToast('Total milk must be greater than 0', 'error');
                    return;
                }
                if (rate <= 0) {
                    showToast('Rate must be greater than 0', 'error');
                    return;
                }

                let records = getRecords();
                const dup = records.find(r => r.customer_id === customer_id && r.date === date && r.id !== id);
                if (dup) {
                    showToast('⚠️ Record already exists for this date', 'error');
                    return;
                }

                const data = {
                    customer_id,
                    date,
                    morning_milk: morning,
                    evening_milk: evening,
                    total_liters: total,
                    rate,
                    amount,
                    notes
                };
                if (id) {
                    const idx = records.findIndex(r => r.id === id);
                    if (idx > -1) records[idx] = { ...records[idx], ...data };
                    showToast('Record updated!', 'success');
                } else {
                    data.id = getNextRecordId();
                    records.push(data);
                    showToast('🥛 Record added!', 'success');
                }
                setRecords(records);
                closeModal();
                renderRecordsList();
                renderDashboard();
                renderCustomersList();
            });
        }

        // ═══════════════════════════════════════════════════════════════
        //  PAYMENTS
        // ═══════════════════════════════════════════════════════════════
        function renderPayments() {
            const container = document.getElementById('tab-payments');
            container.innerHTML = `
                <div class="space-y-3 w-full">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <h2 class="text-lg font-bold">💰 Payments</h2>
                        <div class="filter-container">
                            <select id="paymentFilterCustomer" class="input" style="min-width:120px;min-height:38px;font-size:0.8rem;"></select>
                            <input type="date" id="paymentFilterFrom" class="input" placeholder="From" style="min-height:38px;max-width:140px;font-size:0.8rem;" />
                            <input type="date" id="paymentFilterTo" class="input" placeholder="To" style="min-height:38px;max-width:140px;font-size:0.8rem;" />
                            <button id="paymentApplyFilter" class="btn btn-primary btn-sm">Apply</button>
                            <button id="addPaymentBtn" class="btn btn-success btn-sm">➕ Add</button>

                    </div>

                        <div class="card"><div class="stat-label">Total Payments</div><div class="stat-number" id="totalPayments">0</div></div>

                    </div>
                    
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th><th>Payment Date</th><th>Billing Month</th><th>Customer</th>
                                    <th>Amount</th><th>Mode</th><th>Status</th><th class="text-right">Actions</th>

                            </thead>
                            <tbody id="paymentsTableBody"></tbody>

            populatePaymentDropdowns();
            document.getElementById('paymentApplyFilter').addEventListener('click', () => {
                STATE.paymentsPage = 1;
                renderPaymentsList();
            });
            document.getElementById('addPaymentBtn').addEventListener('click', () => openPaymentModal());
            renderPaymentsList();
        }

        function populatePaymentDropdowns() {
            const customers = getCachedCustomers();
            const sel = document.getElementById('paymentFilterCustomer');
            if (sel) {
                sel.innerHTML = '<option value="">All Customers</option>' + customers.map(c =>
                    `<option value="${c.id}">${sanitizeString(c.name)}</option>`
                ).join('');
            }
        }

        function renderPaymentsList() {
            const filterCust = document.getElementById('paymentFilterCustomer').value;
            const from = document.getElementById('paymentFilterFrom').value;
            const to = document.getElementById('paymentFilterTo').value;
            let list = getCachedPayments();

            if (filterCust) list = list.filter(p => p.customer_id === parseInt(filterCust));
            if (from) list = list.filter(p => p.date >= from);
            if (to) list = list.filter(p => p.date <= to);

            list.sort((a, b) => a.date < b.date ? 1 : -1);

            const totalAmount = list.reduce((s, p) => s + sanitizeNumber(p.amount), 0);
            document.getElementById('totalPayments').textContent = list.length;
            document.getElementById('totalPaymentAmount').textContent = '₹' + totalAmount.toFixed(2);

            const page = STATE.paymentsPage;
            const size = STATE.pageSize;
            const total = list.length;
            const pages = Math.ceil(total / size) || 1;
            const start = (page - 1) * size;
            const end = Math.min(start + size, total);
            const items = list.slice(start, end);

            const currentMonth = new Date().getMonth() + '-' + new Date().getFullYear();

            const tbody = document.getElementById('paymentsTableBody');
            if (!items.length) {
                tbody.innerHTML =
                    '<tr><td colspan="8" class="text-center text-muted py-4">No payments found.</td></tr>';
            } else {
                tbody.innerHTML = items.map(p => {
                    const billingKey = getBillingMonthKey(p);
                    const isCurrentMonth = billingKey === currentMonth;
                    const customer = getCustomer(p.customer_id);
                    const monthlyMilk = getCustomerMonthlyMilk(p.customer_id, billingKey);
                    const monthlyPaid = getCachedPayments().filter(p2 =>
                        p2.customer_id === p.customer_id && getBillingMonthKey(p2) === billingKey
                    ).reduce((s, p2) => s + sanitizeNumber(p2.amount), 0);
                    const isPaid = monthlyMilk - monthlyPaid <= EPS;

                    return `<tr class="${isCurrentMonth ? 'month-current' : 'month-previous'}">
                        <td class="text-xs font-mono">${String(p.id).padStart(4, '0')}</td>
                        <td>${p.date}</td>
                        <td class="text-xs">📌 ${getBillingMonthName(p)}</td>
                        <td>${customer ? sanitizeString(customer.name) : 'Unknown'}</td>
                        <td class="font-bold">₹${sanitizeNumber(p.amount).toFixed(2)}</td>
                        <td><span class="badge badge-active">${sanitizeString(p.mode)}</span></td>
                        <td>
                            <span class="badge ${isPaid ? 'badge-paid' : 'badge-pending'}">
                                ${isPaid ? '✅ Paid' : '⏳ Pending'}
                            </span>
                        </td>
                        <td class="text-right space-x-1">
                            <button onclick="viewPayment(${p.id})" class="btn btn-ghost btn-sm btn-tooltip">
                                👁️ <span class="tooltip-text">View</span>
                            </button>
                            <button onclick="editPayment(${p.id})" class="btn btn-ghost btn-sm btn-tooltip">
                                ✏️ <span class="tooltip-text">Edit</span>
                            </button>
                            <button onclick="deletePayment(${p.id})" class="btn btn-ghost btn-sm text-danger btn-tooltip">
                                🗑️ <span class="tooltip-text">Delete</span>
                            </button>
                        </td>
                    </tr>`;
                }).join('');
            }

            const cardGrid = document.getElementById('paymentsCardGrid');
            if (!items.length) {
                cardGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">💰</div>
                        <div class="empty-title">No payments found</div>
                        <div class="empty-desc">Add your first payment record</div>
                    </div>
                `;
            } else {
                cardGrid.innerHTML = items.map(p => {
                    const customer = getCustomer(p.customer_id);
                    const customerName = customer ? sanitizeString(customer.name) : 'Unknown';
                    const customerId = customer ? sanitizeString(customer.customer_id) : '';
                    const billingKey = getBillingMonthKey(p);
                    const monthlyMilk = getCustomerMonthlyMilk(p.customer_id, billingKey);
                    const monthlyPaid = getCachedPayments().filter(p2 =>
                        p2.customer_id === p.customer_id && getBillingMonthKey(p2) === billingKey
                    ).reduce((s, p2) => s + sanitizeNumber(p2.amount), 0);
                    const isPaid = monthlyMilk - monthlyPaid <= EPS;
                    const billingMonthName = getBillingMonthName(p);

                    return `
                        <div class="payment-card">
                            <div class="payment-header">
                                <div class="payment-customer-info">
                                    <div class="payment-customer-name">${customerName}</div>
                                    <span class="payment-customer-id">${customerId}</span>
                                </div>
                                <div class="payment-amount-wrapper">
                                    <div class="payment-amount-badge">
                                        <span class="currency">₹</span>${sanitizeNumber(p.amount).toFixed(2)}
                                    </div>
                                    <span class="payment-receipt-id">#${String(p.id).padStart(4, '0')}</span>
                                </div>
                            </div>
                            
                            <div class="payment-meta">
                                <span class="meta-item">
                                    <span class="meta-icon">📅</span>
                                    <span class="meta-value">${p.date}</span>
                                </span>
                                <span class="meta-item">
                                    <span class="meta-icon">📌</span>
                                    <span class="meta-value">${billingMonthName}</span>
                                </span>
                                <span class="meta-item">
                                    <span class="meta-icon">💳</span>
                                    <span class="meta-value">${sanitizeString(p.mode)}</span>
                                </span>
                            </div>
                            
                            <div class="payment-footer">
                                <span class="payment-status-badge ${isPaid ? 'paid' : 'pending'}">
                                    ${isPaid ? '✅ Paid' : '⏳ Pending'}
                                </span>
                                ${p.reference ? `<span class="payment-reference">Ref: ${sanitizeString(p.reference)}</span>` : ''}
                            </div>
                            
                            <div class="payment-actions">
                                <button onclick="viewPayment(${p.id})" class="btn btn-ghost btn-sm btn-tooltip">
                                    👁️ <span class="tooltip-text">View</span>
                                </button>
                                <button onclick="editPayment(${p.id})" class="btn btn-ghost btn-sm btn-tooltip">
                                    ✏️ <span class="tooltip-text">Edit</span>
                                </button>
                                <button onclick="deletePayment(${p.id})" class="btn btn-ghost btn-sm text-danger btn-tooltip">
                                    🗑️ <span class="tooltip-text">Delete</span>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            const pag = document.getElementById('paymentsPagination');
            pag.innerHTML = `
                <span>${start + 1}-${end} of ${total}</span>
                <div class="flex gap-1">
                    <button onclick="changePaymentsPage(-1)" class="btn btn-ghost btn-sm" ${page <= 1 ? 'disabled' : ''}>‹</button>
                    <span class="px-2">${page}/${pages}</span>
                    <button onclick="changePaymentsPage(1)" class="btn btn-ghost btn-sm" ${page >= pages ? 'disabled' : ''}>›</button>
                </div>
            `;
        }

        window.changePaymentsPage = (delta) => {
            const list = getCachedPayments();
            const pages = Math.ceil(list.length / STATE.pageSize) || 1;
            STATE.paymentsPage = Math.max(1, Math.min(pages, STATE.paymentsPage + delta));
            renderPaymentsList();
        };

        window.viewPayment = function (id) {
            const p = getCachedPayments().find(p => p.id === id);
            if (!p) { showToast('Payment not found', 'error'); return; }
            const customer = getCustomer(p.customer_id);
            const billingKey = getBillingMonthKey(p);
            const monthlyMilk = getCustomerMonthlyMilk(p.customer_id, billingKey);
            const monthlyPaid = getCachedPayments().filter(p2 =>
                p2.customer_id === p.customer_id && getBillingMonthKey(p2) === billingKey
            ).reduce((s, p2) => s + sanitizeNumber(p2.amount), 0);
            const isPaid = monthlyMilk - monthlyPaid <= EPS;

            openModal(`
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-lg font-bold">💳 Payment Details</h3>
                    <button onclick="window.closeModal()" class="btn btn-ghost btn-sm">✕</button>
                </div>
                <div class="space-y-2 text-sm">
                    <div class="grid-2">
                        <div><span class="text-muted">Receipt #:</span> ${String(p.id).padStart(6, '0')}</div>
                        <div><span class="text-muted">Payment Date:</span> ${p.date}</div>
                        <div><span class="text-muted">Billing Month:</span> ${getBillingMonthName(p)}</div>
                        <div><span class="text-muted">Customer:</span> ${customer ? sanitizeString(customer.name) : 'Unknown'}</div>
                        <div><span class="text-muted">Amount:</span> <strong>₹${sanitizeNumber(p.amount).toFixed(2)}</strong></div>
                        <div><span class="text-muted">Mode:</span> ${sanitizeString(p.mode)}</div>
                        <div><span class="text-muted">Reference:</span> ${sanitizeString(p.reference || '—')}</div>
                        <div><span class="text-muted">Month Status:</span> 
                            <span class="badge ${isPaid ? 'badge-paid' : 'badge-pending'}">
                                ${isPaid ? '✅ Fully Paid' : '⚠️ Pending'}
                            </span>
                        </div>
                    </div>
                    ${p.note ? `<div><span class="text-muted">Note:</span> ${sanitizeString(p.note)}</div>` : ''}
                    <div class="border-t border-border pt-2">
                        <div class="grid-2 text-xs">
                            <span class="text-muted">Month Total Milk: ₹${monthlyMilk.toFixed(2)}</span>
                            <span class="text-muted">Month Total Paid: ₹${monthlyPaid.toFixed(2)}</span>
                            <span class="${monthlyMilk - monthlyPaid > EPS ? 'text-danger' : 'text-success'}">
                                Month Balance: ₹${(monthlyMilk - monthlyPaid).toFixed(2)}
                            </span>
                        </div>
                    </div>
                    <div class="flex gap-2 flex-wrap pt-2 border-t border-border">
                        <button onclick="window.closeModal();generatePaymentReceipt(${p.id})" class="btn btn-primary btn-sm">📄 Receipt</button>
                        <button onclick="window.closeModal();sendPaymentNotification(${p.id})" class="btn btn-success btn-sm">📱 Notify</button>
                    </div>
                </div>
            `);
        };

        window.editPayment = function (id) {
            const p = getCachedPayments().find(p => p.id === id);
            if (!p) { showToast('Payment not found', 'error'); return; }
            const customers = getCachedCustomers();

            let billingMonth = p.billingMonth || new Date(p.date + 'T00:00:00').getMonth() + 1;
            let billingYear = p.billingYear || new Date(p.date + 'T00:00:00').getFullYear();

            const formId = 'paymentForm_' + Date.now();

            openModal(`
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-lg font-bold">✏️ Edit Payment</h3>
                    <button onclick="window.closeModal()" class="btn btn-ghost btn-sm">✕</button>
                </div>
                <form id="${formId}" class="space-y-2" autocomplete="off">
                    <input type="hidden" id="editPaymentId" value="${p.id}" />
                    <div><label class="text-xs font-medium text-muted">Customer *</label>
                        <select id="payCustomer" class="input" required>
                            <option value="">Select</option>
                            ${customers.map(c => `<option value="${c.id}" ${p.customer_id === c.id ? 'selected' : ''}>${sanitizeString(c.name)}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-medium text-muted">Payment Date *</label>
                        <input type="date" id="payDate" value="${p.date}" class="input" required />
                    </div>
                    <div class="payment-month-year-group">
                        <div>
                            <label class="text-xs font-medium text-muted">Billing Month</label>
                            <select id="payBillingMonth" class="input">
                                ${Array.from({ length: 12 }, (_, i) => {
                const monthName = new Date(2000, i, 1).toLocaleString('default', { month: 'long' });
                const monthNum = i + 1;
                const selected = (billingMonth === monthNum) ? 'selected' : '';
                return `<option value="${monthNum}" ${selected}>${monthName}</option>`;
            }).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-medium text-muted">Billing Year</label>
                            <select id="payBillingYear" class="input">
                                ${Array.from({ length: 11 }, (_, i) => {
                const year = new Date().getFullYear() - 5 + i;
                const selected = (billingYear === year) ? 'selected' : '';
                return `<option value="${year}" ${selected}>${year}</option>`;
            }).join('')}
                            </select>
                        </div>
                    </div>
                    <div><label class="text-xs font-medium text-muted">Amount (₹) *</label>
                        <input type="number" id="payAmount" value="${p.amount}" step="0.01" min="0.01" max="999999" class="input" required />
                    </div>
                    <div><label class="text-xs font-medium text-muted">Payment Mode *</label>
                        <select id="payMode" class="input" required>
                            <option value="cash" ${p.mode === 'cash' ? 'selected' : ''}>💵 Cash</option>
                            <option value="upi" ${p.mode === 'upi' ? 'selected' : ''}>📱 UPI</option>
                            <option value="bank_transfer" ${p.mode === 'bank_transfer' ? 'selected' : ''}>🏦 Bank Transfer</option>
                            <option value="cheque" ${p.mode === 'cheque' ? 'selected' : ''}>📝 Cheque</option>
                        </select>
                    </div>
                    <div><label class="text-xs font-medium text-muted">Reference</label>
                        <input type="text" id="payReference" value="${sanitizeString(p.reference || '')}" class="input" maxlength="50" />
                    </div>
                    <div><label class="text-xs font-medium text-muted">Note</label>
                        <input type="text" id="payNote" value="${sanitizeString(p.note || '')}" class="input" maxlength="200" />
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="btn btn-primary flex-1">Update</button>
                        <button type="button" onclick="window.closeModal()" class="btn btn-outline flex-1">Cancel</button>
                    </div>
                </form>
            `);

            const form = document.getElementById(formId);

            // ── VALIDATION: Monthly remaining balance ──
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                const id = parseInt(document.getElementById('editPaymentId').value);
                const customer_id = parseInt(document.getElementById('payCustomer').value);
                const date = document.getElementById('payDate').value;
                const amount = sanitizeNumber(document.getElementById('payAmount').value);
                const mode = sanitizeString(document.getElementById('payMode').value);
                const reference = sanitizeString(document.getElementById('payReference').value);
                const note = sanitizeString(document.getElementById('payNote').value);
                const billingMonth = parseInt(document.getElementById('payBillingMonth').value);
                const billingYear = parseInt(document.getElementById('payBillingYear').value);

                if (!customer_id || !date || amount <= 0) {
                    showToast('Customer, Date and Amount are required', 'error');
                    return;
                }

                // 🆕 Monthly limit check
                const remaining = getMonthlyRemaining(customer_id, billingMonth, billingYear, id);
                if (amount > remaining + EPS) {
                    showToast(`⚠️ Amount exceeds remaining balance for this month (₹${remaining.toFixed(2)}).`, 'error');
                    return;
                }

                let payments = getPayments();
                const idx = payments.findIndex(p => p.id === id);
                if (idx > -1) {
                    payments[idx] = {
                        ...payments[idx],
                        customer_id,
                        date,
                        amount,
                        mode,
                        reference,
                        note,
                        billingMonth,
                        billingYear,
                    };
                    setPayments(payments);
                    showToast('Payment updated!', 'success');
                    closeModal();
                    renderPaymentsList();
                    renderDashboard();
                    renderCustomersList();
                }
            });
        };

        window.deletePayment = function (id) {
            if (!confirm('⚠️ Delete this payment?')) return;
            setPayments(getPayments().filter(p => p.id !== id));
            showToast('Payment deleted', 'info');
            renderPaymentsList();
            renderDashboard();
            renderCustomersList();
        };

            const customers = getCachedCustomers();
            const today = new Date();
            const todayStr = today.toISOString().slice(0, 10);
            const currentMonth = today.getMonth() + 1;
            const currentYear = today.getFullYear();

            if (customers.length === 0) {
                showToast('❌ Please add a customer first!', 'error');
                return;
            }

            const formId = 'paymentForm_' + Date.now();

            openModal(`
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-lg font-bold">💳 Add Payment</h3>
                    <button onclick="window.closeModal()" class="btn btn-ghost btn-sm">✕</button>
                </div>
                <form id="${formId}" class="space-y-2" autocomplete="off">
                    <input type="hidden" id="editPaymentId" value="" />
                    <div><label class="text-xs font-medium text-muted">Customer *</label>
                        <select id="payCustomer" class="input" required>
                            <option value="">Select</option>
                            ${customers.map(c => `<option value="${c.id}" ${customerId === c.id ? 'selected' : ''}>${sanitizeString(c.name)} (${sanitizeString(c.customer_id)})</option>`).join('')}

                    </div>

                        <label class="text-xs font-medium text-muted">Payment Date *</label>

                    <div class="payment-month-year-group">

                const monthNum = i + 1;
                const selected = (currentMonth === monthNum) ? 'selected' : '';

                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-medium text-muted">Billing Year</label>
                            <select id="payBillingYear" class="input">
                                ${Array.from({ length: 11 }, (_, i) => {
                const year = new Date().getFullYear() - 5 + i;
                const selected = (currentYear === year) ? 'selected' : '';
                return `<option value="${year}" ${selected}>${year}</option>`;
            }).join('')}
                            </select>
                        </div>
                    </div>
                    <div><label class="text-xs font-medium text-muted">Amount (₹) *</label>

                    </div>
                    <div><label class="text-xs font-medium text-muted">Payment Mode *</label>
                        <select id="payMode" class="input" required>
                            <option value="cash">💵 Cash</option>
                            <option value="upi">📱 UPI</option>
                            <option value="bank_transfer">🏦 Bank Transfer</option>

                        </select>
                    </div>
                    <div><label class="text-xs font-medium text-muted">Reference</label>

                    </div>
                    <div><label class="text-xs font-medium text-muted">Note</label>
                        <input type="text" id="payNote" value="" class="input" placeholder="Optional" maxlength="200" />
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="btn btn-primary flex-1">Save</button>
                        <button type="button" onclick="window.closeModal()" class="btn btn-outline flex-1">Cancel</button>
                    </div>
                </form>
            `);

            const payCustomer = document.getElementById('payCustomer');
            const payAmount = document.getElementById('payAmount');

            payCustomer.addEventListener('change', function () {
                const id = parseInt(this.value);
                if (id) {
                    const balance = getCustomerBalance(id);
                    payAmount.placeholder = `Balance: ₹${balance.toFixed(2)}`;
                    payAmount.max = balance;
                }
            });
            if (customerId) {
                setTimeout(() => payCustomer.dispatchEvent(new Event('change')), 100);
            }

            const form = document.getElementById(formId);

            // ── VALIDATION: Monthly remaining balance ──
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                const id = parseInt(document.getElementById('editPaymentId').value);
                const customer_id = parseInt(document.getElementById('payCustomer').value);
                const date = document.getElementById('payDate').value;
                const amount = sanitizeNumber(document.getElementById('payAmount').value);
                const mode = sanitizeString(document.getElementById('payMode').value);
                const reference = sanitizeString(document.getElementById('payReference').value);
                const note = sanitizeString(document.getElementById('payNote').value);
                const billingMonth = parseInt(document.getElementById('payBillingMonth').value);
                const billingYear = parseInt(document.getElementById('payBillingYear').value);

                if (!customer_id || !date || amount <= 0) {
                    showToast('Customer, Date and Amount are required', 'error');
                    return;
                }

                // 🆕 Monthly limit check
                const remaining = getMonthlyRemaining(customer_id, billingMonth, billingYear);
                if (amount > remaining + EPS) {
                    showToast(`⚠️ Amount exceeds remaining balance for this month (₹${remaining.toFixed(2)}).`, 'error');
                    return;
                }

                let payments = getPayments();
                const data = {
                    customer_id,
                    date,
                    amount,
                    mode,
                    reference,
                    note,
                    billingMonth,
                    billingYear,

                if (id) {
                    const idx = payments.findIndex(p => p.id === id);
                    if (idx > -1) payments[idx] = { ...payments[idx], ...data };
                    showToast('Payment updated!', 'success');
                } else {
                    data.id = getNextPaymentId();
                    payments.push(data);
                    showToast('💰 Payment added!', 'success');
                }
                setPayments(payments);
                closeModal();
                renderPaymentsList();
                renderDashboard();
                renderCustomersList();
                populatePaymentDropdowns();
            });
        }

        window.openPaymentModal = openPaymentModal;

        // ═══════════════════════════════════════════════════════════════
        //  REPORTS
        // ═══════════════════════════════════════════════════════════════
        let reportData = null;

        function renderReports() {
            const container = document.getElementById('tab-reports');
            container.innerHTML = `
                <div class="space-y-3 w-full">
                    <h2 class="text-lg font-bold">📄 Reports</h2>
                    <div class="card flex flex-wrap gap-3 items-end no-print">
                        <div><label class="text-xs font-medium text-muted">Customer</label>
                            <select id="reportCustomer" class="input" style="min-height:38px;font-size:0.8rem;min-width:140px;"></select>
                        </div>
                        <div><label class="text-xs font-medium text-muted">Month</label>
                            <select id="reportMonth" class="input" style="min-height:38px;font-size:0.8rem;min-width:100px;"></select>
                        </div>
                        <div><label class="text-xs font-medium text-muted">Year</label>
                            <select id="reportYear" class="input" style="min-height:38px;font-size:0.8rem;min-width:90px;"></select>
                        </div>
                        <button id="generateReportBtn" class="btn btn-primary btn-sm">Generate</button>
                        <button id="printReportBtn" class="btn btn-outline btn-sm">🖨️</button>
                        <button id="pdfReportBtn" class="btn btn-outline btn-sm">📄</button>
                        <button id="whatsappReportBtn" class="btn btn-success btn-sm">📱 Send WhatsApp</button>
                    </div>
                    <div id="reportOutput" class="card hidden"></div>
                </div>
            `;

            populateReportDropdowns();
            document.getElementById('generateReportBtn').addEventListener('click', generateReport);
            document.getElementById('printReportBtn').addEventListener('click', printReport);
            document.getElementById('pdfReportBtn').addEventListener('click', printReport);
            document.getElementById('whatsappReportBtn').addEventListener('click', sendReportWhatsApp);
        }

        function populateReportDropdowns() {
            const customers = getCachedCustomers();
            const sel = document.getElementById('reportCustomer');
            if (sel) {
                sel.innerHTML = '<option value="">All Customers</option>' + customers.map(c =>
                    `<option value="${c.id}">${sanitizeString(c.name)}</option>`
                ).join('');
            }

            const now = new Date();
            const monthSel = document.getElementById('reportMonth');
            if (monthSel) {
                monthSel.innerHTML = '';
                for (let m = 0; m < 12; m++) {
                    const opt = document.createElement('option');
                    opt.value = m + 1;
                    opt.textContent = new Date(2000, m, 1).toLocaleString('default', { month: 'long' });
                    if (m === now.getMonth()) opt.selected = true;
                    monthSel.appendChild(opt);
                }
            }

            const yearSel = document.getElementById('reportYear');
            if (yearSel) {
                yearSel.innerHTML = '';
                for (let y = now.getFullYear() - 5; y <= now.getFullYear() + 1; y++) {
                    const opt = document.createElement('option');
                    opt.value = y;
                    opt.textContent = y;
                    if (y === now.getFullYear()) opt.selected = true;
                    yearSel.appendChild(opt);
                }
            }
        }

        function generateReport() {
            const customerId = parseInt(document.getElementById('reportCustomer').value);
            const month = parseInt(document.getElementById('reportMonth').value);
            const year = parseInt(document.getElementById('reportYear').value);

            let records = getCachedRecords();
            let payments = getCachedPayments();

            if (customerId) {
                records = records.filter(r => r.customer_id === customerId);
                payments = payments.filter(p => p.customer_id === customerId);
            }

            const prefix = year + '-' + String(month).padStart(2, '0');
            records = records.filter(r => r.date && r.date.startsWith(prefix));
            payments = payments.filter(p => p.billingMonth === month && p.billingYear === year);

            const totalMilk = records.reduce((s, r) => s + (sanitizeNumber(r.total_liters) * sanitizeNumber(r.rate)), 0);
            const totalLiters = records.reduce((s, r) => s + sanitizeNumber(r.total_liters), 0);
            const totalPaid = payments.reduce((s, p) => s + sanitizeNumber(p.amount), 0);
            const balance = totalMilk - totalPaid;
            const monthName = new Date(2000, month - 1, 1).toLocaleString('default', { month: 'long' });

            const output = document.getElementById('reportOutput');
            output.classList.remove('hidden');

            if (records.length === 0 && payments.length === 0) {
                output.innerHTML = `
                    <div class="text-center text-muted py-8">
                        <div style="font-size:3rem;">📭</div>
                        <p>No data found for ${monthName} ${year}</p>
                        <p class="text-xs mt-1">Try selecting a different month or add some records first.</p>
                    </div>
                `;
                reportData = null;
                return;
            }

            output.innerHTML = `
                <div class="border-b pb-2 mb-3">
                    <h4 class="text-base font-bold">📄 Monthly Report</h4>
                    <p class="text-muted text-xs">${monthName} ${year}${customerId ? ' · ' + getCustomerName(customerId) : ' · All Customers'}</p>
                </div>
                <div class="grid-2 text-sm mb-3">
                    <div class="card p-2"><span class="text-muted">Total Milk (L)</span><br><span class="font-bold">${totalLiters.toFixed(2)} L</span></div>
                    <div class="card p-2"><span class="text-muted">Total Amount</span><br><span class="font-bold">₹${totalMilk.toFixed(2)}</span></div>
                    <div class="card p-2"><span class="text-muted">Total Paid</span><br><span class="font-bold">₹${totalPaid.toFixed(2)}</span></div>
                    <div class="card p-2"><span class="text-muted ${balance > 0 ? 'text-danger' : 'text-success'}">Balance</span><br><span class="font-bold ${balance > 0 ? 'text-danger' : 'text-success'}">₹${balance.toFixed(2)}</span></div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Date</th><th>Customer</th><th>Milk (L)</th><th>Amount</th><th>Type</th><th>Month Status</th></tr></thead>
                        <tbody>
                            ${records.map(r => `<tr><td>${r.date}</td><td>${getCustomerName(r.customer_id)}</td><td>${sanitizeNumber(r.total_liters).toFixed(2)}</td><td>₹${(sanitizeNumber(r.total_liters) * sanitizeNumber(r.rate)).toFixed(2)}</td><td>🥛 Milk</td><td>—</td></tr>`).join('')}
                            ${payments.map(p => {
                const billingKey = getBillingMonthKey(p);
                const monthlyMilk = getCustomerMonthlyMilk(p.customer_id, billingKey);
                const monthlyPaid = getCachedPayments().filter(p2 =>
                    p2.customer_id === p.customer_id && getBillingMonthKey(p2) === billingKey
                ).reduce((s, p2) => s + sanitizeNumber(p2.amount), 0);
                const isPaid = monthlyMilk - monthlyPaid <= EPS;
                return `<tr><td>${p.date}</td><td>${getCustomerName(p.customer_id)}</td><td>—</td>
                                    <td class="text-success">-₹${sanitizeNumber(p.amount).toFixed(2)}</td><td>💰 Payment</td>
                                    <td><span class="badge ${isPaid ? 'badge-paid' : 'badge-pending'}">${isPaid ? '✅ Paid' : '⏳ Pending'}</span></td></tr>`;
            }).join('')}
                        </tbody>
                        <tfoot class="font-bold"><tr>
                            <td colspan="3">Net Balance</td>
                            <td class="${balance > 0 ? 'text-danger' : 'text-success'}">₹${balance.toFixed(2)}</td>
                            <td colspan="2"></td>
                        </tr></tfoot>
                    </table>
                </div>
            `;

            reportData = {
                customerId,
                month,
                year,
                monthName,
                records,
                payments,
                totalMilk,
                totalPaid,
                totalLiters,
                balance
            };
            showToast('📊 Report generated!', 'success');
        }

        function printReport() {
            const content = document.getElementById('reportOutput').innerHTML;
            if (!content) { showToast('Generate report first', 'error'); return; }
            const win = window.open('', '_blank');
            win.document.write(`<html><head><title>Milk Report</title>
                <style>body{font-family:system-ui;padding:2rem;max-width:900px;margin:auto;background:white;color:black;}
                table{width:100%;border-collapse:collapse;font-size:13px;}
                th,td{padding:8px;border:1px solid #ddd;text-align:left;}
                th{background:#f1f5f9;}.card{padding:8px;border:1px solid #ddd;border-radius:8px;margin:4px 0;}
                .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
</style></head><body>${content}<script>window.onload=()=>{window.print();setTimeout(()=>window.close(),1000)}<\/script></body></html>`);
            win.document.close();
        }

        function sendReportWhatsApp() {
            if (!reportData) {
                showToast('Please generate report first', 'error');
                return;
            }

            const { customerId, monthName, year, totalLiters, totalMilk, totalPaid, balance } = reportData;

            let customerName = 'All Customers';
            if (customerId) {
                const customer = getCustomer(customerId);
                if (customer) {
                    customerName = sanitizeString(customer.name);
                }
            }

            let message = "```" +
                `📄 Monthly Report - ${monthName} ${year}\n\n` +
                `👤 Customer: ${customerName}\n` +
                `🥛 Total Milk: ${totalLiters.toFixed(2)} L\n` +
                `💰 Total Amount: ₹${totalMilk.toFixed(2)}\n` +
                `✅ Total Paid: ₹${totalPaid.toFixed(2)}\n` +
                `⏳Balance: ₹${balance.toFixed(2)}\n\n` +
                `Thank you! 🥛` + "```";

            if (customerId) {
                const customer = getCustomer(customerId);
                if (customer && customer.mobile) {
                    sendWhatsApp(customer.mobile, message);
                    showToast(`📱 Sending report to ${sanitizeString(customer.name)}`, 'info');
                    return;
                } else {
                    showToast('❌ Customer mobile number not found.', 'error');
                    return;
                }
            } else {
                const encoded = encodeURIComponent(message);
                const url = `https://wa.me/?text=${encoded}`;
                window.open(url, '_blank');
                showToast('📱 Choose a contact to send the report', 'info');
            }
        }

        // ═══════════════════════════════════════════════════════════════
        //  DROPDOWNS
        // ═══════════════════════════════════════════════════════════════
        function populateDropdowns() {
            populateRecordDropdowns();
            populatePaymentDropdowns();
            populateReportDropdowns();
        }

        // ═══════════════════════════════════════════════════════════════
        //  TAB SWITCHING
        // ═══════════════════════════════════════════════════════════════
        function switchTab(tab) {
            STATE.currentTab = tab;
            const tabs = ['dashboard', 'customers', 'records', 'payments', 'reports'];

            tabs.forEach(t => {
                const content = document.getElementById(`tab-${t}`);
                if (content) content.classList.toggle('hidden', t !== tab);
            });

            document.querySelectorAll('.desktop-nav button[data-tab]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            document.querySelectorAll('.bottom-nav button[data-tab]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            if (tab === 'dashboard') renderDashboard();
            else if (tab === 'customers') renderCustomers();
            else if (tab === 'records') renderRecords();
            else if (tab === 'payments') renderPayments();
            else if (tab === 'reports') renderReports();
        }

        window.switchTab = switchTab;

        // ═══════════════════════════════════════════════════════════════
        //  THEME TOGGLE
        // ═══════════════════════════════════════════════════════════════
        function toggleTheme() {
            STATE.dark = !STATE.dark;
            localStorage.setItem('milkDark', String(STATE.dark));
            document.documentElement.setAttribute('data-theme', STATE.dark ? 'dark' : 'light');
            document.getElementById('themeIcon').textContent = STATE.dark ? '☀️' : '🌙';
            document.getElementById('themeText').textContent = STATE.dark ? 'Light Mode' : 'Dark Mode';
            showToast(`Theme switched to ${STATE.dark ? 'Dark' : 'Light'}`, 'info');
        }

        // ═══════════════════════════════════════════════════════════════
        //  PROFILE TOGGLE – GLOBAL
        // ═══════════════════════════════════════════════════════════════
        function toggleProfile() {
            const dropdown = document.getElementById('profileDropdown');
            const arrow = document.getElementById('profileArrow');
            if (dropdown) {
                dropdown.classList.toggle('open');
                if (arrow) arrow.classList.toggle('open');
            }
        }
        window.toggleProfile = toggleProfile;

        // ── Click outside to close profile dropdown ──
        document.addEventListener('click', function (e) {
            const section = document.querySelector('.profile-section');
            if (section && !section.contains(e.target)) {
                const dropdown = document.getElementById('profileDropdown');
                const arrow = document.getElementById('profileArrow');
                if (dropdown) dropdown.classList.remove('open');
                if (arrow) arrow.classList.remove('open');
            }
        });

        // ═══════════════════════════════════════════════════════════════
        //  🆕 INIT – Fixed logout listener duplication
        // ═══════════════════════════════════════════════════════════════
        let logoutListener = null;

        function initApp() {
            if (STATE.dark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeIcon').textContent = '☀️';
                document.getElementById('themeText').textContent = 'Light Mode';
            }

            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            // ── Fix: Remove previous logout listener before adding new ──
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutListener) {
                logoutBtn.removeEventListener('click', logoutListener);
            }
            logoutListener = function () {
                if (confirm('⚠️ Logout will clear your local data (cloud data is safe). Continue?')) {
                    signOut();
                }
            };
            logoutBtn.addEventListener('click', logoutListener);

            document.querySelectorAll('.desktop-nav button[data-tab]').forEach(btn => {
                btn.addEventListener('click', () => switchTab(btn.dataset.tab));
            });

            document.querySelectorAll('.bottom-nav button[data-tab]').forEach(btn => {
                btn.addEventListener('click', () => switchTab(btn.dataset.tab));
            });

            switchTab('dashboard');

            const customers = getCachedCustomers();
            if (customers.length === 0) {
                showToast('📋 Welcome! Start by adding your first customer.', 'info');
            } else {
                showToast('🥛 Welcome back to MilkCollect!', 'success');
            }
        }

        // ═══════════════════════════════════════════════════════════════
        //  START
        // ═══════════════════════════════════════════════════════════════
        document.addEventListener('DOMContentLoaded', () => {
            initAuth();

            if (STATE.dark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeIcon').textContent = '☀️';
                document.getElementById('themeText').textContent = 'Light Mode';
            }

            if (auth.currentUser) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
            } else {
                const token = localStorage.getItem('milkToken');
                if (token && token.startsWith('demo-')) {
                    document.getElementById('loginPage').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    STATE.hasLoadedData = true;
                    const profile = getProfile();
                    if (profile) {
                        STATE.profile = profile;
                        updateProfileUI(profile);
                    }
                    initApp();
                }
            }
        });

        console.log('🥛 MilkCollect - All issues fixed!');
        console.log('✅ Data isolated per user (Google & Demo separated)');
        console.log('✅ Toast notifications auto-dismiss');
        console.log('✅ Profile click fixed');
        console.log('✅ COOP header added for popups');
        console.log('✅ Firebase persistence updated');
        console.log('✅ Logout – single click, no duplication');
        console.log('✅ Payment – monthly remaining balance check');
    </script>
</body>

</html>
